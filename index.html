<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>botorr.com</title>
<link rel="canonical" href="https://botorr.com/">
<meta http-equiv="refresh" content="0; url=https://botorr.com/">
<script>
  // www.botorr.com 的规范地址是 botorr.com（apex 为主域），这里做等价跳转
  try { location.replace('https://botorr.com/' + location.pathname.replace(/^\//, '') + location.search + location.hash); }
  catch (e) { location.replace('https://botorr.com/'); }
</script>
</head>
